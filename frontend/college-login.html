<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>ScoutHire | College Login</title>

    <link rel="stylesheet"
          href="css/college-auth.css">

</head>

<body>

<div class="authContainer">

    <div class="authCard">

        <h1>ScoutHire</h1>

        <h2>College Login</h2>

        <form id="collegeLoginForm">

            <input
                id="email"
                type="email"
                placeholder="College Email"
                required
            >

            <input
                id="password"
                type="password"
                placeholder="Password"
                required
            >

            <button type="submit">
                Login
            </button>

        </form>

        <p id="message"></p>

        <a href="college-register.html">
            Create College Account
        </a>

    </div>

</div>

<script src="js/college-login.js"></script>

</body>

</html>
