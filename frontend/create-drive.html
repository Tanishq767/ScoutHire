<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ScoutHire | Create Recruitment Drive</title>
    <link rel="stylesheet" href="css/create-drive.css">
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

    <div class="container">
        <a href="dashboard.html" class="backBtn">← Back to Dashboard</a>

        <header class="pageHeader">
            <h1>Create Recruitment Drive</h1>
            <p>Create a new hiring opportunity for your organization.</p>
        </header>

        <form id="driveForm">
            <section class="card">
                <h2>Job Details</h2>
                <div class="input-group">
                    <input type="text" id="jobTitle" required>
                    <label for="jobTitle">Job Title</label>
                </div>
                <div class="input-group">
                    <input type="number" id="package" step="0.1" required>
                    <label for="package">Package (LPA)</label>
                </div>
                <div class="input-group">
                    <input type="text" id="location" required>
                    <label for="location">Location</label>
                </div>
                <div class="formGroup">

                    <label>
                        Target Colleges
                    </label>

                    <p class="fieldHint">
                        Select the colleges where this recruitment drive will be conducted.
                    </p>

                    <div id="collegeList" class="collegeList">

                        <p>
                            Loading approved colleges...
                        </p>

                    </div>

                </div>
            </section>

            <section class="card">
                <h2>Eligibility</h2>
                <div class="input-group">
                    <input type="number" id="minimumCGPA" step="0.1" min="0" max="10" required>
                    <label for="minimumCGPA">Minimum CGPA</label>
                </div>

                <h3>Eligible Branches</h3>
                <div class="checkboxGrid">
                    <label><input type="checkbox" class="branch" value="AD"> Artificial Intelligence and Data Science</label>
                    <label><input type="checkbox" class="branch" value="AI"> Artificial Intelligence and Machine Learning</label>
                    <label><input type="checkbox" class="branch" value="AS"> Aerospace Engineering</label>
                    <label><input type="checkbox" class="branch" value="BT"> Biotechnology Engineering</label>
                    <label><input type="checkbox" class="branch" value="CI"> CSE-AIML Engineering</label>
                    <label><input type="checkbox" class="branch" value="CS"> Computer Science Engineering</label>
                    <label><input type="checkbox" class="branch" value="CV"> Civil Engineering</label>
                    <label><input type="checkbox" class="branch" value="CY"> CSE-Cyber Engineering</label>
                    <label><input type="checkbox" class="branch" value="EC"> Electronics and Communication Engineering</label>
                    <label><input type="checkbox" class="branch" value="EE"> Electrical and Electronics Engineering</label>
                    <label><input type="checkbox" class="branch" value="EI"> Electronics and Instrumentation Engineering</label>
                    <label><input type="checkbox" class="branch" value="ET"> Electronics and Telecommunication Engineering</label>
                    <label><input type="checkbox" class="branch" value="IM"> Industrial Engineering and Management</label>
                    <label><input type="checkbox" class="branch" value="IS"> Information Science and Engineering</label>
                    <label><input type="checkbox" class="branch" value="MD"> Medical Electronics Engineering</label>
                    <label><input type="checkbox" class="branch" value="ME"> Mechanical Engineering</label>
                </div>
            </section>

            <section class="card">
                <h2>Requirements</h2>
                <div class="input-group">
                    <input type="text" id="skills" placeholder="Java, SQL, Spring Boot, React">
                    <label for="skills">Skills</label>
                </div>
                <div class="input-group">
                    <input type="date" id="deadline" required>
                    <label for="deadline" class="dateLabel">Application Deadline</label>
                </div>
            </section>

            <section class="card">
                <h2>Job Description</h2>
                <textarea id="description" rows="7"
                    placeholder="Describe the role, responsibilities, eligibility, selection process and other details..."
                    required></textarea>
            </section>

            <button type="submit">Create Drive</button>
        </form>
    </div>

    <script src="js/create-drive.js"></script>
</body>

</html>
