<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>ScoutHire | College Registration</title>

    <link rel="stylesheet"
          href="css/college-auth.css">

</head>

<body>

<div class="authContainer">

    <div class="authCard">

        <h1>ScoutHire</h1>

        <h2>College Registration</h2>

        <form id="collegeRegisterForm">

            <input
                id="collegeName"
                placeholder="College Name"
                required
            >

            <input
                id="collegeCode"
                placeholder="College Code"
                required
            >

            <input
                id="email"
                type="email"
                placeholder="Official College Email"
                required
            >

            <input
                id="password"
                type="password"
                placeholder="Password"
                required
            >

            <input
                id="location"
                placeholder="Location"
                required
            >

            <input
                id="website"
                placeholder="College Website"
            >

            <input
                id="contactPerson"
                placeholder="Placement Contact Person"
                required
            >

            <input
                id="phone"
                placeholder="Contact Phone"
            >

            <button type="submit">
                Create College Account
            </button>

        </form>

        <p id="message"></p>

        <a href="college-login.html">
            Already have an account? Login
        </a>

    </div>

</div>

<script src="js/college-register.js"></script>

</body>

</html>
