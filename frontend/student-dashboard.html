<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard</title>
    <link rel="stylesheet" href="css/student-dashboard.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

<div class="sidebar">
    <h2>ScoutHire</h2>
    <a href="student-dashboard.html">Dashboard</a>
    <a href="#">My Applications</a>
    <a href="student-profile.html">Profile</a>
    <a href="#" id="logoutBtn">Logout</a>
</div>

<div class="main">

    <div class="topbar">
        <h1>Welcome, <span id="studentName"></span></h1>
        <p id="studentInfo"></p>
    </div>

    <div class="stats">

        <div class="card">
            <h3>Eligible Drives</h3>
            <p id="eligibleCount">0</p>
        </div>

        <div class="card">
            <h3>Applied Drives</h3>
            <p id="appliedCount">0</p>
        </div>

        <div class="card">
            <h3>Shortlisted</h3>
            <p id="shortlistedCount">0</p>
        </div>

    </div>

    <div class="section">

        <div class="sectionHeader">
            <div>
                <h2>Eligible Recruitment Drives</h2>
                <p>Recruitment opportunities matching your profile.</p>
            </div>
        </div>

        <div id="drivesContainer">
            <p class="empty">Loading eligible drives...</p>
        </div>

    </div>

</div>

<script src="js/student-dashboard.js"></script>

</body>
</html>
